# adopted-stack.docker-compose.yml — the delegated stack as one unit.
#
# The Guix counterpart is deploy/guix/adopted-services.scm — same images,
# same ports; this file is what runs on a plain Docker host. Both describe
# the SAME stack — a change here must be mirrored there.
#
# Secrets come from the environment (see adopted-stack.env.example): no
# credential is written in this file, and every *_PASSWORD var must be set
# before `docker compose up` — the services refuse empty passwords.
#
# Bring-up order is declared via depends_on + healthchecks: postgres and
# mosquitto are infra; the adapters' PLAYNET_*_URL endpoints point at the
# service names on `playnet-net` (e.g. http://opa:8181, http://ntfy:80).

name: playnet-adopted

networks:
  playnet-net:
    driver: bridge

services:

  # ── infrastructure ────────────────────────────────────────────────────
  postgres:
    image: docker.io/postgres:16
    restart: unless-stopped
    networks: [playnet-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in env}
      POSTGRES_MULTIPLE_DATABASES: odoo,decidim
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # creates per-service dbs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6

  mosquitto:
    image: docker.io/eclipse-mosquitto:2.0
    restart: unless-stopped
    networks: [playnet-net]
    ports: ["1883:1883"]
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-config:/mosquitto/config
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── compute executors ─────────────────────────────────────────────────
  wasmcloud:
    image: ghcr.io/wasmcloud/wasmcloud:1.8.0
    restart: unless-stopped
    networks: [playnet-net]
    ports: ["8080:8080"]
    environment:
      WASMCLOUD_LATTICE: playnet
      WASMCLOUD_JS_DOMAIN: wasmcloud.local
    volumes: [wasmcloud-data:/var/lib/wasmcloud]

  wasimoff:
    image: ghcr.io/wasimoff/broker:latest  # pin a release tag on deploy
    restart: unless-stopped
    networks: [playnet-net]
    ports: ["4080:4080"]
    volumes: [wasimoff-db:/app/db]

  cpsat:
    image: docker.io/python:3.12-slim
    restart: unless-stopped
    networks: [playnet-net]
    working_dir: /sidecar
    command:
      - sh
      - -c
      - pip install --no-cache-dir 'ortools>=9.10' && exec python cpsat-solve.py
    volumes:
      - ./sidecars:/sidecar:ro
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json; urllib.request.urlopen(urllib.request.Request('http://localhost:5000/solve', data=json.dumps({'ints':[{'name':'x','domain':[0,4]}],'constraints':[{'linear':[[1,'x']],'op':'<=','value':4}],'maximize':[[1,'x']]}).encode(), headers={'Content-Type':'application/json'})).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── economy ───────────────────────────────────────────────────────────
  hrea:
    image: docker.io/hrea/hrea:latest      # pin digest on deploy
    restart: unless-stopped
    networks: [playnet-net]
    ports: ["8888:8888"]
    volumes: [hrea-data:/data]

  cc-node:
    image: gitlab.com/credit-commons/cc-node:latest
    restart: unless-stopped
    networks: [playnet-net]
    ports: ["2020:2020"]
    environment:
      CC_NODE_DB: ${CC_NODE_DB:?set in env}
    volumes: [ccnode-data:/var/lib/cc-node]

  # ── governance / doors ────────────────────────────────────────────────
  opa:
    image: docker.io/openpolicyagent/opa:1.4.2
    restart: unless-stopped
    networks: [playnet-net]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports: ["8181:8181"]
    volumes: [./policies:/policies:ro]
    healthcheck:
      test: ["CMD", "opa", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  decidim:
    image: docker.io/decidim/decidim:latest
    restart: unless-stopped
    networks: [playnet-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/decidim
      DECIDIM_SECRET_KEY_BASE: ${DECIDIM_SECRET_KEY_BASE:?set in env}
      RAILS_ENV: production
    ports: ["3000:3000"]
    volumes:
      - decidim-data:/code
      - decidim-uploads:/code/public/uploads

  # ── execution support ─────────────────────────────────────────────────
  temporalite:
    image: docker.io/temporalio/temporalite:latest
    restart: unless-stopped
    networks: [playnet-net]
    command: ["start", "--ephemeral", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports: ["7233:7233", "8233:8233"]

  # ── knowledge ─────────────────────────────────────────────────────────
  fuseki:
    image: docker.io/stain/jena-fuseki:5.2.0
    restart: unless-stopped
    networks: [playnet-net]
    ports: ["3030:3030"]
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set in env}
    volumes: [fuseki-data:/fuseki]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── interface services ────────────────────────────────────────────────
  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    networks: [playnet-net]
    command: ["serve"]
    ports: ["2586:80"]
    volumes: [ntfy-data:/var/cache/ntfy]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    networks: [playnet-net]
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-unset}   # only when an upstream needs it
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
    ports: ["4000:4000"]

  # ── domain delegation ─────────────────────────────────────────────────
  odoo:
    image: docker.io/odoo:17.0
    restart: unless-stopped
    networks: [playnet-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-addons:/mnt/extra-addons
    ports: ["8069:8069"]

volumes:
  pg-data:
  mosquitto-data:
  mosquitto-config:
  wasmcloud-data:
  wasimoff-db:
  hrea-data:
  ccnode-data:
  decidim-data:
  decidim-uploads:
  fuseki-data:
  ntfy-data:
  odoo-data:
  odoo-addons:
