app = 'xorg-relay'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.relay'

[env]
  PORT = '9090'

[[services]]
  internal_port = 9090
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 64
    soft_limit = 50

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
