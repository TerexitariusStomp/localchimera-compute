app = 'xorg-relay'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.relay'

[env]
  PORT = '9090'

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 64
    soft_limit = 50

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
