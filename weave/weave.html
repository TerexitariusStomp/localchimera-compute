<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weave</title>
  <link rel="stylesheet" href="/weave.css">

  <!--
    LiveKit client SDK.
    For production, pin a specific version and self-host.
    https://docs.livekit.io/client-sdk-js/
  -->
  <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <!--
    weave.js loads weave.wasm via Scheme.load_main.
    The WASM module renders the initial UI into document.body.
    No content needed here — the SXML virtual DOM takes over on load.
  -->
  <noscript>
    <p>Weave requires JavaScript to run. Please enable JavaScript.</p>
  </noscript>

  <!-- Shown by weave.js if WASM fails to compile or load -->
  <div id="wasm-error" hidden style="
    align-items:center; display:flex; flex-direction:column; gap:1rem;
    justify-content:center; min-height:100dvh; padding:2rem; text-align:center;
    font-family:system-ui,sans-serif; background:#1a1a2e; color:#e8e8f0;">
    <h2 style="color:#e74c3c">Weave failed to load</h2>
    <p>The WASM module could not be initialised. Check the browser console for details.</p>
    <p style="font-size:0.85rem;color:#888">
      Requires a browser with WebAssembly GC support (Chrome 119+, Firefox 120+, Safari 18+).
    </p>
  </div>

  <script type="module" src="/weave.js"></script>
</body>
</html>
