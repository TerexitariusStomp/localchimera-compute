name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'server/**'
      - 'key-pool/**'
      - 'planner/**'
      - 'module/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false   # don't cancel a running deploy, just queue

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SERVER_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE7y+yzSS5w+oDfeG8pKgpbcB+Xd2W+WxV1/kAn6Fnlk" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host SERVER_IP
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF

      - name: Copy project to server
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ deploy@SERVER_IP:/home/deploy/playnet-deploy/

      - name: Update Guix on server
        run: |
          # The server's guix must be recent enough to have the Guile
          # bindings that python-rns needs (make-custom-textual-input-port).
          # Pull using the pinned channels so the server matches our config.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=60 \
            deploy@SERVER_IP \
            'sudo guix pull -C /home/deploy/playnet-deploy/deploy/guix/channels.scm --verbosity=1'
        timeout-minutes: 60

      - name: Deploy via remote reconfigure
        run: |
          # guix system reconfigure evaluates the config file inside an
          # isolated build container that only sees /gnu/store. But -e
          # evaluates an expression in the guix CLI process itself (before
          # spawning the build), where the full filesystem is visible.
          # Load the config via -e instead of passing the file path.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=60 \
            deploy@SERVER_IP \
            'sudo /root/.config/guix/current/bin/guix system reconfigure \
              -L /home/deploy/playnet-deploy/deploy/guix \
              -e "(begin
                    (add-to-load-path \"/home/deploy/playnet-deploy/deploy/guix\")
                    (primitive-load \"/home/deploy/playnet-deploy/deploy/guix/machines.scm\")
                    %guix-x86)" \
              --allow-downgrades \
              --verbosity=2'
        timeout-minutes: 90

      - name: Verify
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            deploy@SERVER_IP \
            'sudo herd status'

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
