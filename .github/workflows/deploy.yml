name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'server/**'
      - 'key-pool/**'
      - 'planner/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false   # don't cancel a running deploy, just queue

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SERVER_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE7y+yzSS5w+oDfeG8pKgpbcB+Xd2W+WxV1/kAn6Fnlk" >> ~/.ssh/known_hosts
          # Keep SSH alive during long deploys (substitute downloads can take 15+ min)
          cat >> ~/.ssh/config << 'EOF'
          Host SERVER_IP
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF

      - name: Configure server SSH keepalive
        run: |
          # guile-ssh (used by guix deploy) doesn't read ~/.ssh/config,
          # so keepalive must be set server-side. This ensures sshd keeps
          # the connection alive during long substitute downloads.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            deploy@SERVER_IP \
            'grep -q ClientAliveInterval /etc/ssh/sshd_config 2>/dev/null || \
             sudo sh -c "echo -e \"\\nClientAliveInterval 30\\nClientAliveCountMax 10\" >> /etc/ssh/sshd_config && \
             sudo herd restart sshd" && echo "SSH keepalive configured"'

      - name: Deploy
        env:
          DEPLOY_SSH_IDENTITY: /home/runner/.ssh/deploy_key
        run: |
          sudo -E "$(which guix)" time-machine \
            -C deploy/guix/channels.scm \
            -- deploy \
            -L deploy/guix \
            deploy/guix/machines.scm \
            --verbosity=2
        timeout-minutes: 90

      - name: Verify
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            deploy@SERVER_IP \
            'sudo herd status'

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
