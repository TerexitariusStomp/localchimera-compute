name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'server/**'
      - 'key-pool/**'
      - 'planner/**'
      - 'module/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false   # don't cancel a running deploy, just queue

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SERVER_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE7y+yzSS5w+oDfeG8pKgpbcB+Xd2W+WxV1/kAn6Fnlk" >> ~/.ssh/known_hosts
          # Keep SSH alive during long deploys (substitute downloads can take 15+ min)
          cat >> ~/.ssh/config << 'EOF'
          Host SERVER_IP
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF

      - name: Copy project to server
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ deploy@SERVER_IP:/var/tmp/playnet-deploy/

      - name: Deploy via remote reconfigure
        run: |
          # Run guix system reconfigure ON the server to avoid guile-ssh
          # connection drops. guix deploy uses guile-ssh which has no
          # keepalive support and dies when sshd restarts during activation.
          #
          # Note: guix time-machine uses bwrap isolation and cannot see
          # /var/tmp — use the server's installed guix directly instead.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=60 \
            deploy@SERVER_IP \
            'sudo guix system reconfigure \
              -L /var/tmp/playnet-deploy/deploy/guix \
              /var/tmp/playnet-deploy/deploy/guix/system.scm \
              --verbosity=2'
        timeout-minutes: 90

      - name: Verify
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            deploy@SERVER_IP \
            'sudo herd status'

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
