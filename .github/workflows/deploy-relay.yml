name: Deploy Relay

on:
  push:
    branches: [main]
    paths:
      - 'xorg-relay.scm'
      - 'Dockerfile.relay'
      - 'fly.toml'
      - 'deploy/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
