<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The metabolism on the map — resources transporting, emissions to the sky</title>
<style>
  :root{ --C:#6f6f6f; --N:#3a78c2; --P:#d98a3a; --K:#7d57b0; --warm:#b87333; --gold:#c8a020; --gold-dk:#8a6f12; }
  html,body{margin:0;background:#f4f2ec;color:#1a1a1a;font-family:"Libertinus Serif","Iowan Old Style",Georgia,serif;}
  .wrap{max-width:1060px;margin:0 auto;padding:24px 18px 60px;}
  h1{font-size:22px;font-weight:700;margin:0 0 2px;}
  .sub{font-style:italic;color:#555;font-size:13.5px;margin:0 0 10px;}
  .controls{display:flex;gap:13px;align-items:center;margin:8px 0 2px;font-size:13px;flex-wrap:wrap;}
  .controls button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid #cabfa6;background:#f1ead4;border-radius:5px;cursor:pointer;color:#5a4a16;}
  .controls button:hover{background:#ece2c2;}
  svg{width:100%;height:auto;display:block;}
  figcaption{font-size:13.5px;line-height:1.55;color:#222;margin-top:12px;border-top:1px solid #e3ddd0;padding-top:12px;}
  figcaption b{font-weight:700;}
  .el-C{color:var(--C)} .el-N{color:var(--N)} .el-P{color:var(--P)} .el-K{color:var(--K)}
  #tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #cfc7b6;box-shadow:0 2px 8px rgba(0,0,0,.14);border-radius:5px;padding:6px 9px;font-size:12px;color:#222;opacity:0;transition:opacity .08s;z-index:10;}
</style>
</head>
<body>
<div class="wrap">
  <h1>The metabolism on the map</h1>
  <p class="sub">economic resources &amp; nutrients transporting across real geography &mdash; and rising to the sky</p>
  <div class="controls">
    <button id="loop">close the loop</button>
    <button id="pause">pause</button>
    <label>speed <input id="speed" type="range" min="0.2" max="2.4" step="0.1" value="1"></label>
    <span style="color:#999;font-style:italic">containers carry bundles along the surface; emissions radiate to space</span>
  </div>
  <figure style="margin:0">
    <svg id="fig" viewBox="0 0 1000 720" role="img" aria-label="geographic metabolism"></svg>
    <figcaption>
      <b>Transport is a recipe; the sky is a sink.</b> Each <b>container</b> (□) carries a <b>bundle</b> of
      <span class="el-C">C</span>&middot;<span class="el-N">N</span>&middot;<span class="el-P">P</span>&middot;<span class="el-K">K</span>
      along a <i>surface arc</i> between real places &mdash; food from the <span style="color:#5a8a3a">farmland</span> to the
      <span style="color:#5a6675">city</span>, materials from the <span style="color:#9a5a4a">mine</span> to the
      <span style="color:#9a5a4a">factory</span>, goods onward. Carbon and heat <b>radiate to the sky</b> (outward, fading into space);
      city sewage runs to the <span style="color:#3a78c2">ocean</span>. The nutrients leave the countryside and do not come back &mdash;
      that gap is the <b style="color:#c0392b">metabolic rift</b>, drawn on the map. Hit <i>close the loop</i> to send the
      <span style="color:#7d57b0">compost</span> home: transport and storage are the same recipe that can carry the nutrients
      back and shut the rift.
    </figcaption>
  </figure>
</div>
<div id="tip"></div>

<script src="d3.v7.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="land-110m.js"></script>
<script>
const SVGNS="http://www.w3.org/2000/svg";
const EL={C:"#6f6f6f",N:"#3a78c2",P:"#d98a3a",K:"#7d57b0"}, WARM="#b87333";
const EC=[500,372], ER=300, CENTER=[-22,12];          // globe centre lon/lat
const svg=d3.select("#fig");
const defs=svg.append("defs");
function mk(tag,a){const e=document.createElementNS(SVGNS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
const tipEl=document.getElementById("tip");
const showTip=(ev,h)=>{tipEl.innerHTML=h;tipEl.style.left=(ev.clientX+14)+"px";tipEl.style.top=(ev.clientY+12)+"px";tipEl.style.opacity=1;};
const hideTip=()=>tipEl.style.opacity=0;

// ---------- the map: orthographic globe ----------
const rewindGeo=geo=>{ const fix=poly=>poly.forEach(r=>{ if(d3.geoArea({type:"Polygon",coordinates:[r]})>2*Math.PI) r.reverse(); });
  const g=geo.type==="Feature"?geo.geometry:geo; if(g.type==="Polygon")fix(g.coordinates); else if(g.type==="MultiPolygon")g.coordinates.forEach(fix); return geo; };
let land=null; try{ land=rewindGeo(topojson.feature(window.__land110, window.__land110.objects.land)); }catch(e){}
const proj=d3.geoOrthographic().translate(EC).scale(ER).rotate([-CENTER[0],-CENTER[1]]).precision(0.5);
const path=d3.geoPath(proj);

const og=defs.append("radialGradient").attr("id","ocean").attr("cx","40%").attr("cy","34%").attr("r","78%");
og.append("stop").attr("offset","0%").attr("stop-color","#cfe2ee");
og.append("stop").attr("offset","75%").attr("stop-color","#9dbdd4");
og.append("stop").attr("offset","100%").attr("stop-color","#7fa3bd");
const sg=defs.append("radialGradient").attr("id","sunG");
sg.append("stop").attr("offset","0%").attr("stop-color","#fff6c8"); sg.append("stop").attr("offset","60%").attr("stop-color","#f6cf45"); sg.append("stop").attr("offset","100%").attr("stop-color","#e89c12");
defs.append("clipPath").attr("id","clip").append("circle").attr("cx",EC[0]).attr("cy",EC[1]).attr("r",ER);

const space=svg.append("g");
// stars
for(let i=0;i<80;i++){ const x=10+Math.random()*980,y=10+Math.random()*700; if(Math.hypot(x-EC[0],y-EC[1])>ER+16) space.append("circle").attr("cx",x).attr("cy",y).attr("r",Math.random()*0.9+0.3).attr("fill","#cbc4b6").attr("opacity",Math.random()*0.5+0.2); }
// atmosphere glow + globe
space.append("circle").attr("cx",EC[0]).attr("cy",EC[1]).attr("r",ER+13).attr("fill","none").attr("stroke","#bcdcef").attr("stroke-width",12).attr("opacity",0.35);
const globe=svg.append("g").attr("clip-path","url(#clip)");
globe.append("path").attr("d",path({type:"Sphere"})).attr("fill","url(#ocean)");
globe.append("path").attr("d",path(d3.geoGraticule10())).attr("fill","none").attr("stroke","#fff").attr("stroke-width",0.5).attr("opacity",0.3);
if(land) globe.append("path").attr("d",path(land)).attr("fill","#a7c08f").attr("stroke","#869f78").attr("stroke-width",0.6);
space.append("circle").attr("cx",EC[0]).attr("cy",EC[1]).attr("r",ER).attr("fill","none").attr("stroke","#6f97b6").attr("stroke-width",1);
// sun
const SUN=[96,118],SUNR=42;
for(let i=0;i<12;i++){const a=i/12*2*Math.PI; space.append("line").attr("x1",SUN[0]+Math.cos(a)*(SUNR+3)).attr("y1",SUN[1]+Math.sin(a)*(SUNR+3)).attr("x2",SUN[0]+Math.cos(a)*(SUNR+13)).attr("y2",SUN[1]+Math.sin(a)*(SUNR+13)).attr("stroke","#f0bf3a").attr("stroke-width",2).attr("opacity",0.8);}
space.append("circle").attr("cx",SUN[0]).attr("cy",SUN[1]).attr("r",SUNR).attr("fill","url(#sunG)");
space.append("text").attr("x",SUN[0]).attr("y",SUN[1]+3).attr("text-anchor","middle").attr("font-size",12).attr("font-weight",700).attr("fill","#9a6a10").text("sun");
space.append("text").attr("x",EC[0]).attr("y",EC[1]-ER-22).attr("text-anchor","middle").attr("font-size",10).attr("font-style","italic").attr("fill","#7a8aa0").text("↑ atmosphere → space");

const arcLayer=svg.append("g").attr("clip-path","url(#clip)");
const emitLayer=svg.append("g");
const tokenLayer=svg.append("g");
const placeLayer=svg.append("g");

// ---------- places (lat, lon) ----------
const places=[
  {id:"farm",  label:"farmland", lat:41, lon:-95, col:"#7faa57"},
  {id:"city",  label:"city",     lat:41, lon:-74, col:"#6a7785"},
  {id:"forest",label:"forest",   lat:-3, lon:-60, col:"#3f7d52"},
  {id:"ocean", label:"ocean",    lat:38, lon:-46, col:"#4a86b0"},
  {id:"factory",label:"factory", lat:51, lon:9,   col:"#9a5a4a"},
  {id:"city2", label:"port-city",lat:6,  lon:3,   col:"#6a7785"},
  {id:"mine",  label:"mine",     lat:-26,lon:25,  col:"#9c7a4a"},
];
const P=Object.fromEntries(places.map(p=>[p.id,p]));
places.forEach(p=>{ p.xy=proj([p.lon,p.lat]); p.vis=d3.geoDistance([p.lon,p.lat],CENTER)<Math.PI/2-0.04; });

// ---------- flows ----------
const F=(C,N,Pp,K)=>[["C",C],["N",N],["P",Pp],["K",K]].filter(d=>d[1]>0).map(d=>({el:d[0],color:EL[d[0]],v:d[1]}));
// transport: container carries a bundle along a surface arc between places
const transport=[
  {s:"farm",t:"city", name:"food",     f:F(2,2,1,2), n:4},
  {s:"mine",t:"factory",name:"materials",f:[{el:"·",color:"#9c7a4a",v:3}], n:3},
  {s:"factory",t:"city2",name:"goods", f:[{el:"·",color:"#8a8f7a",v:3}], n:3},
  {s:"factory",t:"city",name:"goods",  f:[{el:"·",color:"#8a8f7a",v:3}], n:2},
  {s:"city",t:"ocean",name:"sewage (rift)", f:F(0,2,1,2), n:3, rift:true},
  {s:"city",t:"farm",name:"compost (return)", f:F(0,2,1,2), n:3, loop:true},
];
// emissions: radiate outward to the sky (from a place)
const emit=[
  {s:"city",   kind:"CO₂",  color:"#6f6f6f", n:3},
  {s:"city",   kind:"heat", color:"#d24a3a", n:2},
  {s:"factory",kind:"CO₂",  color:"#6f6f6f", n:3},
  {s:"city2",  kind:"CO₂",  color:"#6f6f6f", n:2},
];

// ---------- surface arcs (great-circle, projected) ----------
function arcPts(s,t){ const I=d3.geoInterpolate([P[s].lon,P[s].lat],[P[t].lon,P[t].lat]); const pts=[];
  for(let i=0;i<=26;i++){ const xy=proj(I(i/26)); if(xy) pts.push(xy); } return pts; }
function ptAt(pts,u){ if(pts.length<2)return pts[0]||[0,0]; const x=u*(pts.length-1), i=Math.floor(x), f=x-i;
  const a=pts[Math.min(i,pts.length-1)], b=pts[Math.min(i+1,pts.length-1)]; return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]; }
transport.forEach(fl=>{ fl.pts=arcPts(fl.s,fl.t); });

function drawArcs(){
  arcLayer.selectAll("*").remove();
  transport.forEach(fl=>{ if(fl.pts.length<2) return;
    const dash = fl.loop ? "3 4" : null, w = fl.rift?2:2.4, op = fl.loop?0.5:0.5;
    const d="M"+fl.pts.map(p=>p.join(",")).join("L");
    const col=fl.rift?"#c0392b":(fl.loop?"#7d57b0":"#b59a5a");
    arcLayer.append("path").attr("d",d).attr("fill","none").attr("stroke",col).attr("stroke-width",w).attr("opacity",op).attr("stroke-dasharray",dash);
  });
}
drawArcs();

// ---------- glyphs ----------
function container(f){ const g=mk("g",{}); const n=f.length, sq=3.4,gap=0.7,wt=n*(sq+gap)-gap;
  g.appendChild(mk("rect",{x:-wt/2-2,y:-sq/2-2.2,width:wt+4,height:sq+4.4,rx:1.8,fill:"#f4ecd6",stroke:"#b9912f","stroke-width":0.8}));
  f.forEach((d,i)=>g.appendChild(mk("rect",{x:-wt/2+i*(sq+gap),y:-sq/2,width:sq,height:sq,rx:0.5,fill:d.color}))); return g; }

// ---------- tokens ----------
const conv=[]; // transport containers
transport.forEach(fl=>{ if(fl.pts.length<2)return; for(let i=0;i<fl.n;i++){ const el=container(fl.f); tokenLayer.node().appendChild(el); conv.push({fl,el,u:i/fl.n}); } });
const ems=[]; // emission dots
emit.forEach(e=>{ const p=P[e.s]; if(!p.vis)return; const dir=[(p.xy[0]-EC[0]),(p.xy[1]-EC[1])]; const m=Math.hypot(...dir)||1; e.dir=[dir[0]/m,dir[1]/m];
  for(let i=0;i<e.n;i++){ const c=mk("circle",{r:2.4,fill:e.color}); emitLayer.node().appendChild(c); ems.push({e,c,u:i/e.n}); } });

// ---------- places on top ----------
places.forEach(p=>{ if(!p.vis)return;
  const g=placeLayer.append("g").attr("transform",`translate(${p.xy[0]},${p.xy[1]})`);
  g.append("circle").attr("r",13).attr("fill","#fff").attr("opacity",0.85);
  g.append("circle").attr("r",13).attr("fill",d3.color(p.col).copy({opacity:0.5})).attr("stroke",p.col).attr("stroke-width",2);
  g.append("text").attr("text-anchor","middle").attr("y",-17).attr("font-size",11).attr("font-weight",700).attr("fill",d3.color(p.col).darker(1.1)).text(p.label);
});

// ---------- legend ----------
(function(){ const lg=svg.append("g").attr("transform","translate(18,18)");
  [["C",EL.C],["N",EL.N],["P",EL.P],["K",EL.K]].forEach((e,i)=>{const x=i*42;
    lg.append("rect").attr("x",x).attr("y",0).attr("width",10).attr("height",10).attr("rx",1.5).attr("fill",e[1]);
    lg.append("text").attr("x",x+14).attr("y",9).attr("font-size",11).attr("fill",d3.color(e[1]).darker(0.4)).text(e[0]);});
  lg.append("text").attr("x",0).attr("y",26).attr("font-size",11).attr("font-style","italic").attr("fill","#999").text("□ container on a surface arc · dots rising = emissions to the sky"); })();

// ---------- animation ----------
let playing=true, speedMul=1, last=null, loopOn=false;
// hide the compost (return) flow until the loop is closed
function applyLoop(){ const show=loopOn;
  conv.forEach(c=>{ if(c.fl.loop) c.el.style.display=show?null:"none"; });
  arcLayer.selectAll("path").each(function(_,i){ const fl=transport.filter(f=>f.pts.length>=2)[i]; if(fl&&fl.loop) d3.select(this).style("display",show?null:"none"); });
}
applyLoop();
function frame(ts){ if(last==null)last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
  if(playing){
    conv.forEach(c=>{ if(c.fl.loop&&!loopOn)return; const sp=(48*speedMul)/Math.max(40,pathLen(c.fl.pts)); c.u+=dt*sp; if(c.u>1)c.u-=1;
      const xy=ptAt(c.fl.pts,c.u); c.el.setAttribute("transform",`translate(${xy[0].toFixed(1)},${xy[1].toFixed(1)})`); });
    ems.forEach(o=>{ const sp=0.5*speedMul; o.u+=dt*sp; if(o.u>1)o.u-=1; const p=P[o.e.s];
      const r=o.u*78, x=p.xy[0]+o.e.dir[0]*r, y=p.xy[1]+o.e.dir[1]*r;
      o.c.setAttribute("cx",x.toFixed(1)); o.c.setAttribute("cy",y.toFixed(1)); o.c.setAttribute("opacity",(1-o.u)*0.9); });
  }
  requestAnimationFrame(frame);
}
function pathLen(pts){ let L=0; for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); return L; }
requestAnimationFrame(frame);

document.getElementById("loop").onclick=function(){ loopOn=!loopOn; applyLoop(); this.textContent=loopOn?"open the rift":"close the loop"; };
document.getElementById("pause").onclick=function(){ playing=!playing; this.textContent=playing?"pause":"play"; };
document.getElementById("speed").oninput=function(){ speedMul=+this.value; };
</script>
</body>
</html>
