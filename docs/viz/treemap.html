  // or the Φ reading under the priority lens.
  const fillVal = prio ? (d._priority ?? d._progress ?? 0) : (d._progress || 0);
  const pct = Math.round(fillVal * 100);
  const recipe = (!prio && typeof d._zones === "function")
    ? d._zones(pct)
    : {
        dark:  d._isAdmin ? PALETTE.hues.admin : d._isReserve ? PALETTE.hues.reserve : PALETTE.hues.labour,
        light: PALETTE.lighten(d._isAdmin ? PALETTE.hues.admin : d._isReserve ? PALETTE.hues.reserve : PALETTE.hues.labour, 0.7),
        tab:   d._isAdmin ? PALETTE.hues.admin : d._isReserve ? PALETTE.hues.reserve : PALETTE.hues.labour,
        sat:   { primary: `Φ ${pct}%`, secondary: "desire met" },
        gap:   { primary: `${100 - pct}%`, secondary: "unmet desire" },
        tooltip: (v) => `${d.name}\n${v} · Φ ${pct}% desire satisfaction · ${100 - pct}% unmet${hasKids ? "\nclick to zoom in" : ""}`,
      };

  return {
    tab: { color: recipe.tab, label: `${d.name} · ${hrs}`, shortLabel: `${d.name} · ${hrs}` },
    zones: [
      { value: fillVal,     color: recipe.dark,  ...recipe.sat },
      { value: 1 - fillVal, color: recipe.light, textColor: "dark", ...recipe.gap },
    ],
    border: { color: recipe.tab },
    tooltip: recipe.tooltip(hrs),
    onClick,
  };
}

// Realized reproduction labour splits by intent into the three deductions:
// *maintenance* (holds the target steady — simple reproduction), *production*
// (builds it toward a rising target — expanded reproduction), and *insurance*
// (the reserve margin held against accidents and calamities).
// `MAINT_BY_COLOR` / `INS_BY_COLOR` give per-category shares of realized labour;
// production is the remainder. A node may override with `_maint` / `_ins`.
// Individual-claimable goods (no `_catColor`) default to mostly-production:
// a claimed consumable is produced fresh and consumed, not a standing stock
// held and maintained — so the labour reads as production, not upkeep.
const MAINT_BY_COLOR = {
  [PALETTE.hues.commons]:    0.78,  // communal goods: mostly continual re-making
  [PALETTE.hues.means]:      0.82,  // means of production: depreciation/repair
  [PALETTE.hues.skills]:     0.62,  // skills: recert + replacing leavers
  [PALETTE.hues.admin]:      0.80,
  [PALETTE.hues.production]: 0.72,
};
const INS_BY_COLOR = {
  [PALETTE.hues.commons]:    0.10,  // reserve of product (buffered goods)
  [PALETTE.hues.means]:      0.12,  // spare-parts / stand-by capacity
  [PALETTE.hues.skills]:     0.15,  // redundant practitioners (living reserve)
  [PALETTE.hues.admin]:      0.08,
  [PALETTE.hues.production]: 0.08,
};
const maintShareOf = (d, cc) => d._maint ?? MAINT_BY_COLOR[cc] ?? (d._ind ? 0.18 : 0.7);
const insShareOf   = (d, cc) => d._ins   ?? INS_BY_COLOR[cc]   ?? 0.08;

// The reproduction-labour decomposition is one data table — the three
// deductions, each a fold key, a caption, and an intent-lightness (darkest =
// maintenance). Every renderer maps over this; a fourth deduction is one row.
const INTENTS = [
  { key: "maint", label: "maintenance", L: 0.30 },
  { key: "prod",  label: "production",  L: 0.47 },
  { key: "ins",   label: "insurance",   L: 0.64 },
];

// Tree fold (catamorphism): the reproduction-labour decomposition of ANY node.
// A leaf computes its split from required hours, completion, and intent shares;
// a branch is just the per-component sum of its children — so the same
// maintenance/production/insurance mix, and the same realized/required ratio,
// is an emergent property at every level of the tree. Memoised (tree is static).
function repro(node) {
  if (node._repro) return node._repro;
  let r;
  if (node.children?.length) {
    r = { total: 0, realized: 0, maint: 0, prod: 0, ins: 0 };
    for (const ch of node.children) { const c = repro(ch); for (const k in r) r[k] += c[k]; }
  } else {
    const p = node.value || 0;
    const sat = node._sat ?? (node._planned ? node._validated / node._planned : node._progress ?? 0);
    const maint = p * maintShareOf(node, node._catColor);
    const ins   = Math.min(p * insShareOf(node, node._catColor), Math.max(0, p - maint));
    r = { total: p, realized: p * sat, maint, ins, prod: p - maint - ins };
  }
  return (node._repro = r);
}

// The intent fill of ANY node, from its fold — the self-similar surface element
// shared by leaves and scopes. One band per intent (maintenance base → reserve
// top): solid realized below, a lighter desaturated cap of the *same* tone above
// for the labour still to come. *Lightness* names the intent, *saturation* the
// state, off the given base hue `cc`.
function intentZones(node, cc, view) {
  const r = repro(node), p = r.total || 1;
  const left = 1 - r.realized / p;
  const tone = (L, unmet) => {
    const c = d3.hsl(cc);
    if (unmet) { c.l = Math.min(0.9, L + 0.20); c.s *= 0.45; } else c.l = L;
    return c.formatHex();
  };
  return INTENTS.map(it => ({
    value: r[it.key], unmetValue: r[it.key] * left,
    color: tone(it.L, false), unmetColor: tone(it.L, true),
    primary: lensH(r[it.key], view), secondary: it.label,
    ...((it.L > 0.58 || left > 0.55) && { textColor: "dark" }),
  }));
}

// Intent mix as a one-line caption (e.g. "maintenance 71% · production 19% …").
const intentMix = (node) => {
  const r = repro(node);
  return INTENTS.map(it => `${it.label} ${Math.round(r[it.key] / r.total * 100)}%`).join(" · ");
};

// The simple lens: one progress bar from the same fold — realized labour (solid)
// below the labour still to come (light). The calm summary the `detailed` toggle
// expands into the intent bands. Same data, less of it at once.
function progressZones(node, cc, view) {
  const r = repro(node), p = r.total || 1, done = r.realized, pct = Math.round(done / p * 100);
  return [
    { value: done,     color: cc,                       primary: lensH(done, view),     secondary: `${pct}% worked` },
    { value: p - done, color: PALETTE.lighten(cc, 0.6), primary: lensH(p - done, view), secondary: `${100 - pct}% unmet`, textColor: "dark" },
  ];
}

// Either lens for any node: the intent breakdown (detailed) or one bar (simple).
const fillZones = (node, cc, view) =>
  isDetail(view) ? intentZones(node, cc, view) : progressZones(node, cc, view);

// ── The one leaf renderer. Every leaf is reproduction labour toward a target. ─
// Cell height = the total labour *required* to reach the reproduction target
// this period. It splits by intent into three structural bands — *maintenance*
// (holds the target steady — simple reproduction), *production* (builds it
// toward a higher one — expanded reproduction), and *insurance* (the reserve
// margin). Each band is sized by its share of the required
// total; within it, the labour already performed is solid and the labour still
// to come is a lighter, unlabelled cap. Realized labour fills by priority —
// maintenance first, then production, the reserve last (it fills from slack).
function leafCell(d, ancestors, view) {
  if (isPrio(view)) return priorityCell(d, view);
  const r = repro(d), p = r.total;
  const cc   = d._catColor || (d._ind ? PALETTE.hues.production : PALETTE.hues.faint);
  const target = (d.name.split("·")[1] || "").trim();
  const hrs    = lensH(p, view);
  const named  = target ? `${stemOf(d.name)} · ${target}` : stemOf(d.name);
  return {
    tab: {
      color: cc,
      label:      `${named} · ${hrs}`,
      shortLabel: target ? named : `${stemOf(d.name)} · ${hrs}`,
    },
    zones: fillZones(d, cc, view),
    border: { color: cc },
    tooltip: `${d.name}${target ? `\ntarget ${target}` : ""}\n${hrs} required this period · ${Math.round(r.realized / p * 100)}% performed\n`
      + INTENTS.map(it => `${it.label} ${lensH(r[it.key], view)} (${Math.round(r[it.key] / p * 100)}%)`).join("\n")
      + nameOnResource(d),
    onClick: d._resources ? () => APP.navigate({ surface: "map", leaf: d, ancestors }) : null,
  };
}

function containerCell(d, ancestors, view) {
  const r = repro(d), color = d._color || colorOf(d);
  // Total always comes from the fold — never a hardcoded `_label` number, so it
  // can't drift. Keep any descriptive prefix in `_label`, strip its stale total.
  const prefix = (d._label || d.name).replace(/\s*[—·]\s*[\d,\s]+\s*h\s*$/, "").trim();
  const fullLabel = `${prefix} — ${lensH(r.total, view)}`;
  // The fold also gives the container its own intent mix for free — surfaced in
  // the tooltip (its children tile the area, so the tab can't carry a fill).
  return {
    tab: { color, label: fullLabel, shortLabel: `${prefix} · ${lensH(r.total, view)}` },
    zones: null,
    border: { color, width: 1.5 },
    tooltip: `${fullLabel}\n${intentMix(d)}\nclick to zoom in`,
    onClick: () => APP.navigate({ surface: "tree", node: d, ancestors }),
  };
}

// Priority lens for MoC leaves (ind + communal sat): the cell reads as desire
// weight Φ instead of labour-hours. desire weight scales per-capita too.
function priorityCell(d, view) {
  const desW   = d._desireW || 0;
  const sat    = d._desireSat;
  const isCom  = d._catColor === PALETTE.hues.commons;
  const cc     = isCom ? PALETTE.hues.commons : PALETTE.labourLight;
  const cl     = PALETTE.lighten(cc, 0.7);
  const tabColor = isCom ? PALETTE.hues.commons : PALETTE.hues.labour;
  const w = (x) => lensH(x, view);
  const tab    = { color: tabColor,
                   label: `${stemOf(d.name)} · ${w(desW)} priority`,
                   shortLabel: `${stemOf(d.name)} ${lensNum(desW, view)}` };
  if (sat == null) {
    return {
      tab, border: { color: tabColor },
      zones: [{ value: 1, color: cl, primary: w(desW), secondary: "social allocation", textColor: "dark" }],
      tooltip: `${d.name}\n${w(desW)} priority weight\nsocial allocation`,
    };
  }
  return {
    tab, border: { color: tabColor },
    zones: [
      { value: sat,     color: cc, primary: w(desW*sat),     secondary: `${Math.round(sat*100)}% filled` },
      { value: 1 - sat, color: cl, primary: w(desW*(1-sat)), secondary: "gap", textColor: "dark" },
    ],
    tooltip: `${d.name}\n${w(desW)} priority weight\n${Math.round(sat*100)}% delivered`,
  };
}

const CELL_RENDERERS = { scope: scopeCell, ind: leafCell, sat: leafCell, container: containerCell };
const nodeToCell = (d, ancestors, view) => {
  const r = CELL_RENDERERS[kindOf(d)];
  return r ? r(d, ancestors, view) : null;
};

// Walk the laid-out d3 hierarchy, drawing every descendant. Scope nodes are
// treated as leaves by the layout's children accessor (see zoomTo), so we
// don't need to short-circuit recursion ourselves — .descendants() naturally
// stops there.
function renderHierarchy(svg, root, ancestors, view) {
  for (const h of root.descendants().slice(1)) {
    const cell = nodeToCell(h.data, ancestors, view);
    if (cell) drawCell(svg, h.x0, h.y0, h.x1 - h.x0, h.y1 - h.y0, cell);
  }
}

// ── Pill-shaped toggle widget (N modes, click cycles to the next). ──
// `tg` is a toggle spec { modes:[...], colors:[...] }; `active` is 0..N-1.
// Two modes → a flip; three+ → a segmented cycle. The slider sits under the
// active segment and each label lights when current.
function drawToggle(parent, x, y, w, h, tg, active, onChange) {
  const n = tg.modes.length, seg = w / n;
  const g = parent.append("g").style("cursor","pointer");
  g.append("rect").attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("fill","rgba(0,0,0,0.3)").attr("rx",h/2);
  g.append("rect").attr("x", x + seg * active).attr("y",y).attr("width",seg).attr("height",h)
    .attr("fill", tg.colors[active]).attr("rx", h/2);
  tg.modes.forEach((m, i) => {
    g.append("text").attr("x", x + seg * i + seg/2).attr("y", y + h*0.7)
      .attr("text-anchor","middle").attr("fill", i === active ? "white" : "rgba(255,255,255,0.5)")
      .attr("font-size", n > 2 ? "8px" : "9px").attr("font-weight", i === active ? "bold" : "normal").text(m);
  });
  const next = (active + 1) % n;
  g.append("title").text(`switch to ${tg.modes[next]}`);
  g.on("click", (e) => { e.stopPropagation(); onChange(next); });
}

// ── Breadcrumb header text, rendered as one continuous trail. ──
// The path (rainbow logo or "← a / b / c") and the total caption live in the
// SAME <text> element via tspans, so the total always follows the trail with
// no width measurement needed — it just flows after the last crumb.
function appendTitleText(textSel, ancestors, node, total, view) {
  // 1. The path.
  if (ancestors.length === 0 && node._titleRender === "rainbow") {
    const label = (node._label || node.name).split("·")[0].trim();
    [...label].forEach((ch, i) =>
      textSel.append("tspan").attr("fill", SPECTRUM[i % SPECTRUM.length])
        .attr("font-weight","bold").text(ch));
  } else {
    const crumbs = ancestors.map(a => a.name).concat(node.name);
    textSel.append("tspan").attr("fill","white").attr("font-weight","bold")
      .text("← " + crumbs.join(" / "));
  }
  // 2. The total caption, flowing right after the path (dimmer, lighter weight).
  const cap = node._totalCaption || "";
  const caption = cap ? `${cap} · ${lensH(total, view)}` : lensH(total, view);
  textSel.append("tspan").attr("fill","rgba(255,255,255,0.8)").attr("font-weight","500")
    .attr("dx", 6).text(`· ${caption}`);
}

// ── Header = breadcrumb tab at the top of the view (root cell). ──
// The two view toggles always live here, on the focused tab — that is the
// entire placement rule. Both lenses (scope, measure) apply at every level.
function drawHeader(svg, root, node, ancestors, color, total, view) {
  const rect = { x: root.x0, y: root.y0, w: root.x1 - root.x0, h: 22 };
  const hdrG = svg.append("g").style("cursor", ancestors.length ? "pointer" : "default");
  drawTabBackground(hdrG, rect, color);

  // One text element: path + total caption flow as one trail (no measurement).
  const titleEl = hdrG.append("text").attr("x", rect.x + 8).attr("y", rect.y + 15)
    .attr("font-size","12px");
  appendTitleText(titleEl, ancestors, node, total, view);

  // Toggles, laid out right-to-left on the focus tab. The axis lens is added
  // only at an axis-root (the federation), where row/column duals both exist.
  const tgs = node._axisRoot ? [...TOGGLES, AXIS_TOGGLE] : TOGGLES;
  const PW = 104, PGAP = 6;
  tgs.forEach((tg, i) => {
    const x = root.x1 - 8 - (tgs.length - i) * PW - (tgs.length - 1 - i) * PGAP;
    drawToggle(svg, x, rect.y + 3, PW, 16, tg, view[tg.key], (next) => {
      VIEW[tg.key] = next;
      APP.navigate({ surface: "tree", node, ancestors });
    });
  });

  if (ancestors.length) {
    hdrG.append("title").text("click to go back");
    hdrG.on("click", () =>
      APP.navigate({ surface: "tree", node: ancestors.at(-1), ancestors: ancestors.slice(0, -1) }));
  }
}

// ── Pure surface renderer — reads APP.state, draws the tree view. ───────
// Called by the surface view's mount(); never call directly, always go
// through APP.navigate({ surface: "tree", node, ancestors }).
function renderTreeSurface() {
  const { node, ancestors } = APP.state;
  if (_mapInstance) { try { _mapInstance.remove(); } catch(e){} _mapInstance = null; }
  surfaceDiv.innerHTML = "";

  if (!node.children) return;

  // Measure container for pixel-perfect rendering
  const rect = surfaceDiv.getBoundingClientRect();
  W = Math.round(rect.width);
  H = Math.round(rect.height);
  if (W < 100 || H < 100) { W = 928; H = 750; }

  const color = node._color || colorOf(node) || PALETTE.hues.means;
  const total = sumTree(node);

  // The two lenses are global and always live on the focused tab — no owner
  // lookup, no ancestor walk. `view` is just the current VIEW snapshot.
  const view = VIEW;

  // One spacing constant. Every black gap on the surface is GAP px. Layout
  // is inset by GAP from all four sides; paddingTop reserves room for the
  // breadcrumb header. Scope nodes act as leaves (custom children accessor).
  const GAP = 8;
  const root = layoutTreemap(
    { name: node.name, children: childrenFor(node) },
    [W - 2*GAP, H - 2*GAP],
    {
      // Scopes act as leaves; otherwise descend via childrenFor so an
      // axis-root swaps its column/row dual under the active axis lens.
      children: (n) => kindOf(n) === "scope" ? null : childrenFor(n),
      padding:  { outer: 0, top: 22 + GAP, inner: GAP },
      round:    false,
    },
  );

  const svg = d3.create("svg")
    .attr("viewBox", [0,0,W,H])
    .attr("style","font:10px sans-serif;opacity:0;");
  const defs = svg.append("defs");
  // All drawing lives inside this translated group → uniform GAP margin around everything.
  const root_g = svg.append("g").attr("transform", `translate(${GAP},${GAP})`);

  drawHeader(root_g, root, node, ancestors, color, total, view);

  // ── Render every node uniformly: nodeToCell + drawCell ──
  renderHierarchy(root_g, root, [...ancestors, node], view);

  surfaceDiv.appendChild(svg.node());
  requestAnimationFrame(() => svg.attr("style","font:10px sans-serif;opacity:1;transition:opacity 0.3s ease;"));
}
// Re-render on resize for pixel-perfect SVG — just re-mount the whole app.
let _resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => APP.render(), 200);
});

// ═══════════════════════════════════════════════════════════════════════════
// SIDEBAR — 5 equal-flex treemap panels
// ═══════════════════════════════════════════════════════════════════════════

// ── Shared treemap-layout primitive ─────────────────────────────────────
// Both the main surface and every sidebar panel are treemaps. They differ
// only in the cell renderer and the layout knobs. This is the one place
// that calls d3.treemap.
//
//   data          — { name, children: [...] } (children may contain children)
//   size          — [w, h] in viewBox pixels
//   opts.children — custom accessor (e.g. treat scopes as leaves)
//   opts.padding  — { outer=0, top=0, inner=1 }
//   opts.sum      — leaf-value extractor (default: d.value)
//   opts.round    — round to whole pixels (default true)
//
// Returns the d3 hierarchy root with `.x0/.y0/.x1/.y1` filled in. Iterate
// `.descendants().slice(1)` to draw children, or `.leaves()` for flat
// panels.
function layoutTreemap(data, [w, h], opts = {}) {
  const { children, padding = {}, sum = (d) => d.value || 0, round = true } = opts;
  const tm = d3.treemap().size([w, h])
    .paddingOuter(padding.outer ?? 0)
    .paddingTop  (padding.top   ?? padding.outer ?? 0)
    .paddingInner(padding.inner ?? 1)
    .round(round);
  return tm(
    d3.hierarchy(data, children).sum(sum).sort((a, b) => b.value - a.value)
  );
}

// Pull a viewBox from a container after the label has been laid out. Used
// by every sidebar panel so they all share the same measure logic.
function measurePanelBox(div, lbl) {
  const rect = div.getBoundingClientRect();
  const lblH = lbl.getBoundingClientRect().height + 4;
  return {
    w: Math.max(40, Math.round(rect.width)),
    h: Math.max(40, Math.round(rect.height - lblH)),
  };
}

// Standard panel scaffold: clear, label, then run `draw(svg, w, h)` on the
// next frame with the measured box. Returns nothing.
function withPanel(containerId, label, draw) {
  const div = document.getElementById(containerId);
  div.innerHTML = "";
  const lbl = document.createElement("div");
  lbl.className = "bar-label";
  lbl.innerHTML = label;
  div.appendChild(lbl);
  requestAnimationFrame(() => {
    const { w, h } = measurePanelBox(div, lbl);
    const svg = d3.create("svg").attr("viewBox", [0, 0, w, h])
      .attr("preserveAspectRatio","none")
      .attr("style", `width:100%;height:${h}px;display:block;`);
    draw(svg, w, h);
    div.appendChild(svg.node());
  });
}

// Generic treemap panel: lays out segments and draws one rect each.
function renderPanel(containerId, label, segments) {
  withPanel(containerId, label, (svg, w, h) => {
    const root = layoutTreemap(
      { name: "root", children: segments.map(s => ({ name: s.label, value: s.value, _color: s.color })) },
      [w, h],
      { padding: { inner: 1 }, round: true },
    );
    for (const leaf of root.leaves()) {
      const d = leaf.data, x = leaf.x0, y = leaf.y0, lw = leaf.x1 - leaf.x0, lh = leaf.y1 - leaf.y0;
      svg.append("rect").attr("x",x).attr("y",y).attr("width",lw).attr("height",lh)
        .attr("fill", d._color).attr("rx", 1);
      svg.append("title").text(`${d.name}: ${d.value.toFixed(1)}`);
      if (lw * lh > 400 && Math.min(lw, lh) > 18) {
        const mind = Math.min(lw, lh);
        svg.append("text").attr("x", x + lw/2).attr("y", y + lh/2 + 3)
          .attr("text-anchor","middle").attr("fill","white").attr("font-weight","bold")
          .attr("font-size", mind > 50 ? "11px" : mind > 30 ? "9px" : "7px").text(d.name);
      }
    }
  });
}

// ── Subscript digits for voice labels ───────────────────────────────────
const SUB = ["", "₁","₂","₃","₄","₅","₆","₇","₈","₉","₁₀","₁₁","₁₂"];
const voiceRow = (pcts, suffix) => pcts.map((v, i) => ({
  label: `p${SUB[i + 1]} ${v}${suffix}`, value: v, color: PALETTE.voice[i],
}));

// ── Federation-level panels ────────────────────────────────────────────
const fedFreeTime = () => [
  { label: `labour l = ${FREE_TIME.labour}%`, value: FREE_TIME.labour, color: PALETTE.hues.labour },
  { label: `free f = ${FREE_TIME.free}%`,     value: FREE_TIME.free,   color: PALETTE.hues.free   },
];
// Federation social desire satisfaction M̄ — labour-weighted mean of activity
// _M, weighted by each activity's folded hours (sumTree, never a stale value).
function computeSocialDesireSat() {
  let num = 0, den = 0;
  for (const s of (FED._colChildren || [])) {
    if (typeof s._M === "number") { const v = sumTree(s); num += s._M * v; den += v; }
  }
  return den > 0 ? num / den : 0;
}
const fedDesireSat = () => {
  const m = computeSocialDesireSat();
  const sat = Math.round(m * 100), unmet = 100 - sat;
  return [
    { label: `unmet ${unmet}%`,        value: unmet, color: PALETTE.hues.refuse },
    { label: `satisfied M̄ = ${sat}%`,  value: sat,   color: PALETTE.hues.plan   },
  ];
};

// Dial of Withering — one square. Width-split: labour column (width = l) on
// the left, free-time column (width = f) on the right. Inside each column the
// shaded portion (from the bottom) is the share of NEEDS MET during that mode,
// expressed as a fraction of total time. Total filled area = total needs met.
//
//   workMet = M̄·l       — needs met during work, as a share of total time
//   freeMet = M̄_free·f  — needs met during free time, as a share of total time
//
// M̄_free is the share of free-time hours that ended up meeting a social need
// (mutual aid, communal cooking, care, etc.) — set in FREE_TIME.freeMetShare.
function renderDial(containerId, label) {
  withPanel(containerId, label, (svg, W, H) => {
    const l           = FREE_TIME.labour / 100;
    const f           = FREE_TIME.free   / 100;
    const workMetFrac = computeSocialDesireSat();              // M̄ within work
    const freeMetFrac = FREE_TIME.freeMetShare ?? 0.45;        // M̄ within free
    const workMet     = workMetFrac * l;                       // share of total
    const freeMet     = freeMetFrac * f;

    const lPx = Math.round(W * l);
    const fPx = W - lPx;
    const workMetH = Math.round(H * workMetFrac);
    const freeMetH = Math.round(H * freeMetFrac);
    const pct = x => Math.round(x * 100);
    const cells = [
      // Work column — light backdrop + filled "needs met" portion at bottom.
      { x:0, y:0,            w:lPx, h:H - workMetH, fill:PALETTE.lighten(PALETTE.hues.labour, 0.55), label:`work: unmet ${pct(l - workMet)}%` },
      { x:0, y:H - workMetH, w:lPx, h:workMetH,     fill:PALETTE.hues.labour,                       label:`needs met at work ${pct(workMet)}% (M̄·l)` },
      // Free column — light backdrop + filled "needs met in free time".
      { x:lPx, y:0,            w:fPx, h:H - freeMetH, fill:PALETTE.lighten(PALETTE.hues.free, 0.55), label:`free: leisure ${pct(f - freeMet)}%` },
      { x:lPx, y:H - freeMetH, w:fPx, h:freeMetH,     fill:PALETTE.hues.free,                       label:`needs met in free time ${pct(freeMet)}% (M̄_f·f)` },
    ];
    for (const c of cells) {
      svg.append("rect").attr("x",c.x).attr("y",c.y).attr("width",c.w).attr("height",c.h)
        .attr("fill",c.fill);
      svg.append("title").text(c.label);
      if (c.w * c.h > 800 && Math.min(c.w, c.h) > 20) {
        svg.append("text").attr("x", c.x + c.w/2).attr("y", c.y + c.h/2 + 3)
          .attr("text-anchor","middle").attr("fill","white")
          .attr("font-size", Math.min(c.w, c.h) > 50 ? "10px" : "8px")
          .attr("font-weight","bold").text(c.label);
      }
    }
    // Divider between work / free columns.
    svg.append("line").attr("x1",lPx).attr("x2",lPx).attr("y1",0).attr("y2",H)
      .attr("stroke","#0e0e0e").attr("stroke-width",1);
  });
}
// ── Sidebar panel data ──────────────────────────────────────────────────
const creditData = () => [
  { label: "claimed 45 h",    value: 45,  color: PALETTE.creditClaimed   },
  { label: "remaining 435 h", value: 435, color: PALETTE.creditRemaining },
];

// ── Sidebar declared as a list. Each panel: { id, kind, fed, scope }.
//   kind:  "panel" (treemap) | "dial" (2D dial)
//   fed:   { label, data() } for the federation view
//   scope: same shape, used at depth ≥ 1
// Adding or reordering a panel = edit this list. To diverge fed/scope
// further, just give them different label or data builders.
const SIDEBAR_PANELS = [
  { id: "panel-prod", kind: "panel",
    fed:   { label: "producer voice ∝ L<sub>p</sub> (unequal)",
             data:  () => voiceRow([6.2,5.8,5.5,5.2,5.0,4.8,4.5,4.3,4.0,3.8,3.5,3.2], "%") },
    scope: { label: "scope producer voice: L<sub>p,s</sub>/L<sub>s</sub>",
             data:  () => voiceRow([480, 360, 320, 280, 200, 160], " h") } },
  // freetime / Φ panels removed — these are now spatial in the treemap.
  { id: "panel-cons", kind: "panel",
    fed:   { label: "consumer voice v<sub>p</sub><sup>cons</sup> (more equal)",
             data:  () => voiceRow([4.8,4.6,4.4,4.3,4.2,4.1,4.0,3.9,3.8,3.7,3.6,3.5], "%") },
    scope: { label: "scope consumer voice: v<sub>p</sub><sup>cons</sup>",
             data:  () => voiceRow([380, 340, 310, 290, 250, 230], " h") } },
  { id: "panel-credit", kind: "panel",
    fed:   { label: "credit: 45/480 h — K·v<sub>p</sub><sup>cons</sup>", data: creditData },
    scope: { label: "credit: 45/480 h — K·v<sub>p</sub><sup>cons</sup>", data: creditData } },
];

const PANEL_RENDERERS = {
  panel: (id, label, data) => renderPanel(id, label, data),
  dial:  (id, label)       => renderDial(id, label),
};

function renderSidebar(depth) {
  const view = depth >= 1 ? "scope" : "fed";
  for (const p of SIDEBAR_PANELS) {
    const cfg = p[view];
    PANEL_RENDERERS[p.kind](p.id, cfg.label, cfg.data?.());
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// APP — the interface is a tree of views.
//
// Each view owns a region of the DOM and knows how to render itself given a
// state slice. The router (`navigate`) maps state changes to view renders.
// Adding a new view = add an entry; swapping the surface implementation =
// change the entry's `render`.
//
//   APP.views: { id, mount } walked by mountApp at startup
//   APP.navigate(target, opts)  — go to a different surface state
//   APP.state — { surface: "tree"|"map", node, ancestors, leaf? }
// ═══════════════════════════════════════════════════════════════════════════
const APP = {
  state: { surface: "tree", node: TREE, ancestors: [], leaf: null },

  views: [
    { id: "surface", mount: () =>
        (APP.state.surface === "map" ? renderMapSurface : renderTreeSurface)() },
    { id: "sidebar", mount: () => renderSidebar(APP.state.ancestors.length) },
    { id: "drawer",  mount: renderJourneyDrawer },
  ],

  render() { for (const v of this.views) v.mount(); },

  navigate(patch) {
    Object.assign(this.state, patch);
    this.render();
  },
};

APP.render();

</script>
